name: End-to-End (E2E) Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        run: npm run build

      - name: Execute All Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  android-emulator-e2e:
    name: Android Emulator E2E Tests (Option C)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          npm install --include=optional
          npm install @rollup/rollup-darwin-arm64 lightningcss-darwin-arm64 @tailwindcss/oxide-darwin-arm64 --no-save || true

      - name: Build Web Application
        run: npm run build

      - name: Bundle Web Assets into Android Native Shell
        run: |
          mkdir -p android-shell/app/src/main/assets
          cp -r dist/* android-shell/app/src/main/assets/
          echo "Bundled web assets:"
          ls -la android-shell/app/src/main/assets/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-shell

      - name: Build Android Debug APK
        run: |
          chmod +x android-shell/gradlew
          cd android-shell
          ./gradlew assembleDebug --stacktrace

      - name: Run E2E Test on Android Emulator (Option C)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: true
          ram-size: 2048M
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot-save -no-window -gpu host -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            adb install -r android-shell/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.ytviewer.app/.MainActivity
            sleep 8
            adb shell dumpsys activity com.ytviewer.app
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png ./android-emulator-screenshot.png
            echo "Android Native Shell APK successfully booted and verified on Android Emulator (Option C)!"

      - name: Upload Android Emulator Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-artifacts
          path: |
            android-emulator-screenshot.png
            android-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
