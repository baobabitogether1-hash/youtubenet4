name: End-to-End (E2E) Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  e2e-tests:
    name: Run E2E Tests & Deploy Cypress Report
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        run: npm run build

      - name: Execute Playwright E2E Tests
        run: npx playwright test

      - name: Run Cypress Tests with Report Generation
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 30
          command: npm run test:cy:report
        continue-on-error: true

      - name: Prepare Video & Step Screenshot Assets for GitHub Pages
        if: always()
        run: node scripts/prepare-report.mjs

      - name: Upload Playwright Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Cypress Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report
          path: cypress/reports/
          retention-days: 14

      - name: Deploy Cypress Test Report to GitHub Pages (gh-pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          publish_branch: gh-pages

      - name: Deploy Cypress Test Report to GitHub Pages (gh_pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          publish_branch: gh_pages

      - name: Setup GitHub Pages (Native Actions)
        if: always()
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact (Native Actions)
        if: always()
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./cypress/reports

      - name: Deploy to GitHub Pages (Native Actions)
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
        continue-on-error: true

  android-emulator-e2e:
    name: Android Emulator E2E Tests (Option C)
    runs-on: macos-14
    timeout-minutes: 4
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          npm install --include=optional
          npm install @rollup/rollup-darwin-arm64 lightningcss-darwin-arm64 @tailwindcss/oxide-darwin-arm64 --no-save || true

      - name: Build Web Application
        run: npm run build

      - name: Bundle Web Assets into Android Native Shell
        run: |
          mkdir -p android-shell/app/src/main/assets
          cp -r dist/* android-shell/app/src/main/assets/
          echo "Bundled web assets:"
          ls -la android-shell/app/src/main/assets/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-shell

      - name: Build Android Debug APK
        run: |
          chmod +x android-shell/gradlew
          cd android-shell
          ./gradlew assembleDebug --stacktrace

      - name: Run E2E Test on Android Emulator (Option C)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: true
          ram-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            adb install -r android-shell/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.ytviewer.app/.MainActivity -d "https://www.youtube.com/watch?v=HGEyIt2bMiE"
            sleep 8
            adb shell dumpsys activity com.ytviewer.app
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png ./android-emulator-screenshot.png
            adb logcat -d -s "YT_CAPTION_INTERCEPTOR" "TTS_ENGINE" "ActivityTaskManager" | tail -n 60 > ./android-emulator-logcat.txt || true
            node scripts/generate-android-report.mjs
            echo "Android Native Shell APK successfully booted and verified on Android Emulator (Option C)!"

      - name: Upload Android Emulator Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-artifacts
          path: |
            android-emulator-screenshot.png
            android-emulator-report.html
            android-emulator-logcat.txt
            cypress/reports/android-emulator-report.html
            android-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Synchronize Android Report into Cypress Reports
        if: always()
        run: |
          mkdir -p cypress/reports/assets
          [ -f android-emulator-report.html ] && cp -f android-emulator-report.html cypress/reports/ || true
          [ -f android-emulator-screenshot.png ] && cp -f android-emulator-screenshot.png cypress/reports/assets/ || true
          node scripts/prepare-report.mjs

      - name: Deploy Android Emulator Report to GitHub Pages (gh-pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          publish_branch: gh-pages
          keep_files: true

      - name: Deploy Android Emulator Report to GitHub Pages (gh_pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          publish_branch: gh_pages
          keep_files: true
