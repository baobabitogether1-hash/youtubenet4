name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0). Leave blank to auto-generate from run number'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false
      build_release_apk:
        description: 'Build Release APK (default: false, skips release build)'
        required: false
        type: boolean
        default: false
      run_e2e_tests:
        description: 'Run E2E UI verification tests and produce video artifact'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Bundle Web Assets into Android Project
        run: |
          mkdir -p android-shell/app/src/main/assets
          cp -r dist/* android-shell/app/src/main/assets/
          echo "Web assets successfully bundled into Android assets directory:"
          ls -la android-shell/app/src/main/assets/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-shell
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android-shell/gradlew

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-shell/local.properties

      # Build Android Release APK (Skipped by default per configuration)
      - name: Build Android Release APK (Skipped by default)
        if: github.event.inputs.build_release_apk == 'true'
        run: |
          cd android-shell
          ./gradlew assembleRelease --stacktrace

      # Main build target: Debug APK (always builds fast and without keystore requirements)
      - name: Build Android Debug APK
        run: |
          cd android-shell
          ./gradlew assembleDebug --stacktrace

      - name: Package & Verify APK Artifacts
        if: always()
        run: |
          mkdir -p release-artifacts
          
          # Find and copy debug APK
          find android-shell/app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} release-artifacts/YouTube-Viewer-debug.apk \; 2>/dev/null || true
          
          # If release APK was built, copy it too
          find android-shell/app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} release-artifacts/YouTube-Viewer-release.apk \; 2>/dev/null || true

          # If debug APK was not in standard folder, find first available apk
          if [ ! -f "release-artifacts/YouTube-Viewer-debug.apk" ]; then
            first_apk=$(find android-shell/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "$first_apk" ]; then
              cp "$first_apk" release-artifacts/YouTube-Viewer-debug.apk
            fi
          fi

          cd release-artifacts
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              sha256sum "$apk" > "${apk}.sha256"
            fi
          done
          
          echo "=== COMPILED APK ARTIFACTS ==="
          ls -lh
          echo "=============================="

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-viewer-apks
          path: release-artifacts/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Determine Release Tag & Title
        id: release_info
        if: success()
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="YouTube Viewer ${TAG}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="YouTube Viewer ${TAG}"
          else
            TAG="v1.0.${{ github.run_number }}"
            TITLE="YouTube Viewer v1.0 (Build ${{ github.run_number }})"
          fi
          
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "TITLE=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "Computed Tag: ${TAG}"
          echo "Computed Title: ${TITLE}"

      - name: Publish GitHub Release with Working APK
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 YouTube Viewer Android App Release

            ### 📦 Download Links
            - **[Download YouTube-Viewer-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG }}/YouTube-Viewer-debug.apk)** (Latest APK - Ready to install)
            - Automated install script available in repository: `install-apk.bat` (Windows) / `install-apk.ps1` (PowerShell) / `install-apk.sh` (Bash)

            ---

            ### 🚀 Features Included in this APK:
            - **Native Network Interceptor**: Directly intercepts YouTube caption HTTP streams (`youtube.com/api/timedtext`) using `WebViewClient` and native `OkHttp`.
            - **Offline & Standalone Ready**: Embeds the full modern web UI locally via `WebViewAssetLoader`, ensuring fast start times and responsive video controls.
            - **Universal YouTube URL Support**: Parses watch URLs, youtu.be shortlinks, Shorts, Live streams, embed codes, iframe tags, and custom timestamps.
            - **Signed & Verified**: Built with Android 14 (API 34) SDK and compatible with Android 7.0+ (API 24 to 35).

            ---

            ### 📲 How to Install on Android:
            1. Download `YouTube-Viewer-release.apk` directly to your phone.
            2. Tap the completed download in your notification bar or Files app.
            3. If prompted, enable **"Install unknown apps"** for your browser or file manager.
            4. Tap **Install** and open YouTube Viewer!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # POST-RELEASE E2E TEST WITH VIDEO ARTIFACT
      # =========================================================================
      - name: Install Playwright Browsers & OS Dependencies
        if: (!cancelled()) && (github.event.inputs.run_e2e_tests != 'false')
        run: |
          echo "Installing Playwright Chromium browser and OS dependencies..."
          npx playwright install --with-deps chromium

      - name: Run E2E Tests with Video Recording
        if: (!cancelled()) && (github.event.inputs.run_e2e_tests != 'false')
        run: |
          mkdir -p e2e-video-artifacts
          echo "Executing Playwright E2E UI verification test..."
          npx playwright test || true

          echo "Searching for recorded video files in test-results..."
          count=1
          find test-results -type f \( -name "*.webm" -o -name "*.mp4" \) | while read -r vid; do
            echo "Archiving video artifact: $vid"
            cp "$vid" "e2e-video-artifacts/youtube-viewer-e2e-run-${count}.webm"
            cp "$vid" "e2e-video-artifacts/youtube-viewer-e2e-run.webm"
            count=$((count+1))
          done

          if [ -d "playwright-videos" ]; then
            cp -r playwright-videos/* e2e-video-artifacts/ 2>/dev/null || true
          fi

          echo "E2E Video artifacts ready:"
          ls -la e2e-video-artifacts/

      - name: Upload E2E Test Video Artifact
        if: (!cancelled()) && (github.event.inputs.run_e2e_tests != 'false')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-video-recording
          path: e2e-video-artifacts/*
          retention-days: 14
          if-no-files-found: warn

      - name: Attach E2E Video Artifact to GitHub Release
        if: success() && steps.release_info.outputs.TAG != '' && (github.event.inputs.run_e2e_tests != 'false')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          files: e2e-video-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

