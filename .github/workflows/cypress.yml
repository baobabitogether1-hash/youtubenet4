name: Cypress E2E Tests & GitHub Pages Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cypress-run:
    name: Cypress E2E Tests & Browsable Presentation
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Run Cypress Tests with Mochawesome Report
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 30
          command: npm run test:cy:report
        continue-on-error: true

      - name: Prepare Cypress Browsable Presentation Assets
        if: always()
        run: node scripts/prepare-report.mjs

      - name: Upload Cypress Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-artifacts
          path: cypress/reports/
          retention-days: 14

      - name: Deploy Cypress Presentation to GitHub Pages (gh-pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          publish_branch: gh-pages

      - name: Deploy Cypress Presentation to GitHub Pages (gh_pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          publish_branch: gh_pages
