<!doctype html>
<html lang="en">
  <head>
    <script>
      // Filter benign Vite websocket / HMR notifications in container preview environments
      (function() {
        if (typeof window !== 'undefined' && window.console && window.console.error) {
          var origError = window.console.error;
          window.console.error = function() {
            var first = arguments[0];
            var firstStr = typeof first === 'string' ? first : '';
            var allStr = Array.prototype.slice.call(arguments).map(function(a) {
              return String(a && a.message ? a.message : a || '');
            }).join(' ');
            if (
              firstStr === '[vite]' ||
              firstStr.indexOf('[vite]') !== -1 ||
              allStr.indexOf('failed to connect to websocket') !== -1 ||
              allStr.indexOf('vite-plugin-pwa:dev-ready') !== -1
            ) {
              if (window.console.debug) {
                window.console.debug.apply(window.console, arguments);
              }
              return;
            }
            return origError.apply(window.console, arguments);
          };
        }
      })();
    </script>
